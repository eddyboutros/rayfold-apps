# Serves one front end's build. The gateway strips the /remotes/<app>/ prefix before a request reaches here, so
# every app is served from / regardless of the path it lives at outside.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # hashed bundles never change under one name; index.html and remoteEntry.json are what point at the current ones
  location ~* \.(js|css|woff2?|ico|svg|png)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /remoteEntry.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # the shell routes on the client; a deep link has to land on index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
