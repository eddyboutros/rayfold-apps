<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keel</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafbfc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1017" />
    <!--
      Where each remote's service is. Behind a gateway these are empty and every remote uses the page's own origin;
      in development the services are on their own ports. The bundles are the same either way.
    -->
    <meta name="documents-origin" content="http://localhost:4001" />
    <meta name="workspace-origin" content="http://localhost:4002" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 L21 8 V16 L12 22 L3 16 V8 Z' fill='none' stroke='%232757d6' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M12 7 L16.5 9.8 V14.2 L12 17 L7.5 14.2 V9.8 Z' fill='%232757d6' opacity='.5'/%3E%3C/svg%3E" />
    <script>
      // the chosen theme before the first paint, so a dark page does not flash white on the way in
      try {
        const t = localStorage.getItem("keel.theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <style>
      html { background: #fafbfc; }
      html[data-theme="dark"] { background: #0d1017; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #0d1017; } }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
