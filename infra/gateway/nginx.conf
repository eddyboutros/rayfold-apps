# The gateway: one origin for the page, every remote, and every service.
#
# This is what makes the arrangement deployable. A browser sees one host, so nothing is cross-origin: no CORS, no
# preflights, no list of allowed origins in any service. Each path below is owned by one team and forwards to the
# container that team ships, so a new documents-ui or a new documents service is a new container behind the same
# path and nothing else moves.
#
#   /                        the shell
#   /remotes/<app>/          a remote's bundle, loaded by the shell at runtime
#   /api/<service>/rayfold   a service's endpoint; the prefix is stripped, the service sees /rayfold
#   /api/documents/files/    where a document's bytes are served from
#   /help/                   the public help centre, and /api/help/ its anonymous, cached door onto the catalogue

worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  # a live query holds its response open and the server writes frames as they happen; buffering would hold them
  proxy_buffering off;
  proxy_http_version 1.1;
  proxy_read_timeout 1h;

  # every forwarded request carries the host the browser used, port included: a service compares the browser's
  # Origin against it to decide whether a write is cross-site, and `$host` drops the port, which is why a page on
  # :8080 was refused with 403 while curl was let through
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # the shared cache in front of the help centre's reads. what goes in it is decided by the service, not here: a
  # response is kept only when its Cache-Control says public, for as long as it says, and kept serving while stale for
  # as long as its stale-while-revalidate allows, while one request fetches it again
  proxy_cache_path /var/cache/nginx/help levels=1:2 keys_zone=help:10m max_size=100m inactive=1h use_temp_path=off;

  upstream shell        { server shell:80; }
  upstream documents_ui { server documents-ui:80; }
  upstream workspace_ui { server workspace-ui:80; }
  upstream catalogue_ui { server catalogue-ui:80; }
  upstream documents    { server documents:4000; }
  upstream workspace    { server workspace:4000; }
  upstream catalogue    { server catalogue:4000; }
  upstream approvals    { server approvals:4004; }
  upstream feedback     { server feedback:4000; }
  upstream help         { server help:80; }

  server {
    listen 80;
    server_name _;

    # ---- services. the prefix is stripped: the service sees /rayfold, /rayfold/uploads, /files/... as it always did
    location /api/documents/ {
      proxy_pass http://documents/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # an upload is streamed through; a whole file buffered here would be the one place it is held twice
      proxy_request_buffering off;
      client_max_body_size 64m;
    }

    location /api/workspace/ {
      proxy_pass http://workspace/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location /api/catalogue/ {
      proxy_pass http://catalogue/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # the fleet's JVM member: the same path shape, the same headers; nothing in front of it knows the runtime
    location /api/approvals/ {
      proxy_pass http://approvals/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # the help centre's door onto the catalogue: anonymous by construction. the cookie and the Authorization header
    # are dropped here, so whoever a browser is signed in as, the catalogue sees nobody: only what is public answers,
    # and every answer is the same for every visitor, which is what lets one cached copy serve them all
    location /api/help/ {
      proxy_pass http://catalogue/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      # reads only: a query by URL is the one shape of request a cache may keep
      limit_except GET HEAD { deny all; }
      proxy_cache help;
      # the URL is the query (canonical arguments in `a`, the shape in `s`), and Accept the format it comes back in
      proxy_cache_key "$request_uri|$http_accept";
      # an expired copy is checked with If-None-Match, which the service answers 304 when nothing changed
      proxy_cache_revalidate on;
      proxy_cache_use_stale updating error timeout;
      proxy_cache_background_update on;
      proxy_cache_lock on;
      # the service varies on Rayfold-Client, Accept and Authorization: the second is in the key, the third is dropped
      # above, and the first only names the caller for the service's usage counts, so one copy serves every client
      proxy_ignore_headers Vary;
      add_header X-Cache-Status $upstream_cache_status always;
      # buffered, unlike the others: nothing here is live, and a response is cached only once it is whole
      proxy_buffering on;
    }

    # the support team's service: "was this helpful?". the visitor's cookie goes through, and the session's, so a
    # member of the team reading the help centre is a member here too
    location /api/feedback/ {
      proxy_pass http://feedback/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- the public help centre: its own container, another team's, not a remote of the shell
    location /help/ {
      proxy_pass http://help/;
      proxy_set_header Host $http_host;
    }

    # ---- remotes. each is its own container, deployed on its own; the shell loads them from here at runtime
    location /remotes/documents-ui/ {
      proxy_pass http://documents_ui/;
      proxy_set_header Host $http_host;
    }

    location /remotes/workspace-ui/ {
      proxy_pass http://workspace_ui/;
      proxy_set_header Host $http_host;
    }

    location /remotes/catalogue-ui/ {
      proxy_pass http://catalogue_ui/;
      proxy_set_header Host $http_host;
    }

    # ---- the page
    location / {
      proxy_pass http://shell;
      proxy_set_header Host $http_host;
    }
  }
}
