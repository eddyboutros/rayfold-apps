# The fleet, as it runs. One Postgres behind every service: each owns its own tables, and they share the two the
# platform needs — idempotency records, so a retry that reaches another instance replays, and the relay, so a live
# query on one service hears a command run on another.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: rayfold
      POSTGRES_DB: apps
    ports: ["${POSTGRES_PORT:-55433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # postgres 18's image keeps data under /var/lib/postgresql/<major>/, so the volume mounts one level up;
      # mounted at the old .../data it refuses to start
      - pgdata:/var/lib/postgresql

  # services publish no port: the gateway is the only way in, as in a real deployment. GET /api/<service>/rayfold/stats
  # reaches a service's own stats route through it, with the ops token.
  documents:
    build:
      context: .
      dockerfile: services/documents/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:rayfold@postgres:5432/apps
      # every service in the fleet shares this, so a capability token minted by one is honoured by the next
      CAPABILITY_SECRET: ${CAPABILITY_SECRET:-a-development-secret-at-least-16}
      OPS_TOKEN: ${OPS_TOKEN:-dev-ops-token}
      SERVICE_VERSION: ${GIT_SHA:-dev}
      FILES_DIR: /var/lib/documents/files
      UPLOADS_DIR: /var/lib/documents/uploads
      # what a document's url starts with, as reached through the gateway
      PUBLIC_BASE: /files
      # where a worker in the fleet fetches a document's bytes: this container, on the compose network
      SELF_URL: http://documents:4000
      # the Rayfold Console, when one runs beside the fleet: configuration, the queue, traces. it is a separate
      # commercial product (private repository, not yet on sale); empty means none, and the fleet runs without it
      CONSOLE_URL: ${CONSOLE_URL:-}
      CONSOLE_TOKEN: ${CONSOLE_TOKEN:-}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
    volumes:
      - documents:/var/lib/documents
    depends_on:
      postgres: { condition: service_healthy }
    # what the platform answers, used as the platform intends: traffic only while it says it is ready
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/rayfold/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    # a deploy sends this and waits; the service drains, so a rolling restart loses nothing
    stop_signal: SIGTERM
    stop_grace_period: 30s

  workspace:
    build:
      context: .
      dockerfile: services/workspace/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:rayfold@postgres:5432/apps
      # the same secret as documents: a capability token one service mints is honoured by the next
      CAPABILITY_SECRET: ${CAPABILITY_SECRET:-a-development-secret-at-least-16}
      OPS_TOKEN: ${OPS_TOKEN:-dev-ops-token}
      SERVICE_VERSION: ${GIT_SHA:-dev}
      CONSOLE_URL: ${CONSOLE_URL:-}
      CONSOLE_TOKEN: ${CONSOLE_TOKEN:-}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/rayfold/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_signal: SIGTERM
    stop_grace_period: 30s

  catalogue:
    build:
      context: .
      dockerfile: services/catalogue/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:rayfold@postgres:5432/apps
      CAPABILITY_SECRET: ${CAPABILITY_SECRET:-a-development-secret-at-least-16}
      OPS_TOKEN: ${OPS_TOKEN:-dev-ops-token}
      SERVICE_VERSION: ${GIT_SHA:-dev}
      CONSOLE_URL: ${CONSOLE_URL:-}
      CONSOLE_TOKEN: ${CONSOLE_TOKEN:-}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/rayfold/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_signal: SIGTERM
    stop_grace_period: 30s

  # the fleet's JVM member: Kotlin on Spring Boot, the same Postgres, the same relay and idempotency tables, the same
  # session cookie. The gateway puts it at /api/approvals like the others; nothing in front of it knows the runtime.
  approvals:
    build:
      context: .
      dockerfile: services/approvals/Dockerfile
    environment:
      PORT: 4004
      DATABASE_URL: postgres://postgres:rayfold@postgres:5432/apps
      OPS_TOKEN: ${OPS_TOKEN:-dev-ops-token}
      SERVICE_VERSION: ${GIT_SHA:-dev}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4004/rayfold/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_signal: SIGTERM
    stop_grace_period: 30s

  # ---- the front ends: one container each, built from its own lockfile, deployed on its own
  shell:
    build: { context: web, dockerfile: Dockerfile, args: { APP: shell } }
  documents-ui:
    build: { context: web, dockerfile: Dockerfile, args: { APP: documents-ui, BASE_HREF: /remotes/documents-ui/ } }
  workspace-ui:
    build: { context: web, dockerfile: Dockerfile, args: { APP: workspace-ui, BASE_HREF: /remotes/workspace-ui/ } }
  catalogue-ui:
    build: { context: web, dockerfile: Dockerfile, args: { APP: catalogue-ui, BASE_HREF: /remotes/catalogue-ui/ } }

  # ---- one origin for all of it
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:80"]
    depends_on:
      - shell
      - documents-ui
      - workspace-ui
      - catalogue-ui
      - approvals
      - documents
      - workspace
      - catalogue

volumes:
  pgdata:
  documents:
