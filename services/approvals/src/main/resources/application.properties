spring.application.name=approvals
server.port=${PORT:4004}

rayfold.schema=classpath:approvals.rayfold
rayfold.path=/rayfold
# the gateway and the dev proxy put every service on the page's own origin, so there is nothing to allow
rayfold.allowed-origins=${ALLOWED_ORIGINS:}
rayfold.budget=${COST_BUDGET:1000}
rayfold.websocket=true
rayfold.explorer.enabled=${EXPLORER:false}
rayfold.explorer.title=Approvals

# the same Postgres as the rest of the fleet, in the same URL form the other services take
keel.database-url=${DATABASE_URL:postgres://postgres:rayfold@127.0.0.1:55432/apps}
keel.ops-token=${OPS_TOKEN:}
keel.version=${SERVICE_VERSION:dev}
keel.instance=${INSTANCE:}

logging.level.root=warn
logging.level.keel=info
