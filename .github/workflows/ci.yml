name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  services:
    name: Services against a real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: rayfold
          POSTGRES_DB: apps
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:rayfold@127.0.0.1:5432/apps
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # a service is tested the way it is deployed: its own main.ts, its own migration, a real database
      - run: npm test

  images:
    name: Every service builds an image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f services/documents/Dockerfile -t apps/documents .
      - run: docker build -f services/workspace/Dockerfile -t apps/workspace .

  frontends:
    name: Every front end builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [shell, documents-ui, workspace-ui]
    defaults:
      run:
        working-directory: web/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # each front end is its own project with its own lockfile, so each installs on its own
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx ng build
