name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  services:
    name: Services against a real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: rayfold
          POSTGRES_DB: apps
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:rayfold@127.0.0.1:5432/apps
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # each schema against its lockfile: a breaking change to a contract fails the build, not a customer (spec 11)
      - run: npm run schema:check
      # the help centre's and the signoff client's types are generated from the schemas they read; a schema changed
      # without them fails here
      - run: npm run schema:types && git diff --exit-code web/help/src/gen clients/signoff/src/main/kotlin/keel/signoff/api
      # a service is tested the way it is deployed: its own main.ts, its own migration, a real database
      - run: npm test

  approvals:
    name: The JVM service and its client against a real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: rayfold
          POSTGRES_DB: apps
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:rayfold@127.0.0.1:5432/apps_jvm
    defaults:
      run:
        working-directory: services/approvals
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # the same way the Dockerfile builds it: the wrapper, the tests against the database
      - run: chmod +x mvnw && ./mvnw -q -B verify
      # the Kotlin client, against the jar just built and tested: the service as it is deployed, not a stand-in
      - run: chmod +x mvnw && ./mvnw -q -B verify
        working-directory: clients/signoff

  images:
    name: Every service builds an image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f services/documents/Dockerfile -t apps/documents .
      - run: docker build -f services/workspace/Dockerfile -t apps/workspace .
      - run: docker build -f services/catalogue/Dockerfile -t apps/catalogue .
      - run: docker build -f services/approvals/Dockerfile -t apps/approvals .
      - run: docker build -f services/feedback/Dockerfile -t apps/feedback .
      - run: docker build --build-arg APP=shell -t apps/shell web
      - run: docker build --build-arg APP=documents-ui --build-arg BASE_HREF=/remotes/documents-ui/ -t apps/documents-ui web
      - run: docker build --build-arg APP=workspace-ui --build-arg BASE_HREF=/remotes/workspace-ui/ -t apps/workspace-ui web
      - run: docker build --build-arg APP=catalogue-ui --build-arg BASE_HREF=/remotes/catalogue-ui/ -t apps/catalogue-ui web
      - run: docker build --build-arg APP=help -t apps/help web

  frontends:
    name: Every front end builds
    runs-on: ubuntu-latest
    strategy:
      # every front end reports on its own; one failing must not hide what the others would have said
      fail-fast: false
      matrix:
        app: [shell, documents-ui, workspace-ui, catalogue-ui, help]
    defaults:
      run:
        working-directory: web/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # each front end is its own project with its own lockfile, so each installs on its own
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      # ng build for the Angular apps, tsc and vite build for the help centre: each project says how it builds
      - run: npm run build
      # each front end's specs, against real Rayfold servers built from the services' own schemas: ng test for the
      # Angular apps, vitest for the help centre. Once, not watching
      - run: npm test -- --watch=false
